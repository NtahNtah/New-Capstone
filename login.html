<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Programmer Zaman Now</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        
        body {
            background-color: #acd2f7;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #4267B2;
            color: white;
            padding: 1rem 3rem;
        }
        
        .navbar-logo {
            font-size: 1.2rem;
            font-weight: 500;
        }
        
        .navbar-logo a {
            color: white;
            text-decoration: none;
        }
        
        .navbar-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
        
        .navbar-link {
            color: white;
            text-decoration: none;
            font-size: 1rem;
        }
        
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            border: none;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background-color: white;
            color: #4267B2;
        }
        
        .login-container {
            max-width: 400px;
            margin: 2rem auto;
            padding: 2rem;
        }
        
        .login-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: #333;
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
            font-size: 1rem;
        }
        
        .form-control {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 0.25rem;
            font-size: 1rem;
        }
        
        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        
        .form-checkbox input {
            width: 18px;
            height: 18px;
        }
        
        .form-checkbox label {
            font-size: 1rem;
            color: #666;
        }
        
        .btn-login {
            width: 100%;
            padding: 0.8rem;
            background-color: #ED4C78;
            color: white;
            font-size: 1rem;
            border: none;
            border-radius: 0.25rem;
            cursor: pointer;
            margin-bottom: 1.5rem;
        }
        
        .info-box {
            background-color: #f1f1f1;
            padding: 1rem;
            border-radius: 0.25rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }
        
        .info-icon {
            font-size: 1.2rem;
            color: #666;
        }
        
        .info-text {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.4;
        }
        
        .info-text a {
            color: #ED4C78;
            text-decoration: none;
        }
        
        .signup-link {
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }
        
        .signup-link a {
            color: #ED4C78;
            text-decoration: none;
        }
        
        .footer {
            background-color: #4267B2;
            color: white;
            padding: 2rem 0;
            margin-top: auto;
        }
        
        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            display: flex;
            justify-content: space-between;
        }
        
        .footer-copyright {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        
        .footer-links {
            display: flex;
            gap: 4rem;
        }
        
        .footer-links-column {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .footer-link {
            color: white;
            text-decoration: none;
            font-size: 1rem;
        }
        
        .footer-link:hover {
            text-decoration: underline;
        }
        
        .checkbox-custom {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 1px solid #ddd;
            border-radius: 3px;
            outline: none;
            position: relative;
            cursor: pointer;
            background-color: white;
        }
        
        .checkbox-custom:checked {
            background-color: #ED4C78;
            border-color: #ED4C78;
        }
        
        .checkbox-custom:checked::after {
            content: '';
            position: absolute;
            left: 6px;
            top: 2px;
            width: 4px;
            height: 8px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-logo">
            <a href="index.html">Capstone Project - Kelompok B</a>
        </div>
        <div class="navbar-links">
            <a href="index.html".html" class="navbar-link">Home</a>
            <a href="signup.html" class="navbar-link">Sign up</a>
            <a href="login.html" class="btn btn-primary">Log in</a>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="login-container">
        <h1 class="login-title">Log In</h1>
        
        <form action="#" method="post">
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="you@email.com" required>
            </div>
            
            <div class="form-checkbox">
                <input type="checkbox" id="remember-me" class="checkbox-custom">
                <label for="remember-me">Remember me</label>
            </div>
            
            <button type="submit" class="btn-login">Log In</button>
            
            <div class="info-box">
                <div class="info-icon">ℹ️</div>
                <div class="info-text">
                    We will email you a code for a password-free log in. Or you can <a href="#">log in with a password</a> instead.
                </div>
            </div>
            
            <div class="signup-link">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </div>
        </form>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-copyright">
                © 2025 Capstone Project - Kelompok B
            </div>
            <div class="footer-links">
                <div class="footer-links-column">
                    <a href="#" class="footer-link">Youtube</a>
                    <a href="#" class="footer-link">Instagram</a>
                    <a href="#" class="footer-link">Facebook</a>
                </div>
                <div class="footer-links-column">
                    <a href="#" class="footer-link">Terms of Use</a>
                    <a href="#" class="footer-link">Privacy Policy</a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
